<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0A0A0A">
  <title>অর্ডার সফল হয়েছে — Loyalty Access Fashion</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .success-card { background: linear-gradient(135deg, rgba(34, 197, 94, 0.08) 0%, rgba(20, 20, 20, 0.95) 100%); border: 1.5px solid rgba(34, 197, 94, 0.35); border-radius: var(--radius); padding: 36px 20px; text-align: center; margin-top: 30px; }
    .checkmark-circle { stroke-dasharray: 166; stroke-dashoffset: 166; stroke-width: 3; stroke: #22c55e; fill: none; animation: strokeCheck 0.6s forwards; }
    .checkmark-check { transform-origin: 50% 50%; stroke-dasharray: 48; stroke-dashoffset: 48; stroke: #22c55e; animation: strokeCheck 0.3s 0.6s forwards; }
    @keyframes strokeCheck { 100% { stroke-dashoffset: 0; } }
    .fade-in-btn { opacity: 0; transform: translateY(20px); transition: 0.8s ease; visibility: hidden; }
    .fade-in-btn.show { opacity: 1; transform: translateY(0); visibility: visible; }
  </style>
</head>
<body>
  <div class="announce">⚡ সারা দেশে ক্যাশ অন ডেলিভারি | 📞 WhatsApp: +8801601866686</div>
  <header class="site-header">
    <div class="container header-inner"><a href="index.html" class="logo"><span class="logo-main">LOYALTY ACCESS</span></a></div>
  </header>
  <section class="container section" style="max-width: 600px;">
    <div class="success-card">
      <svg style="width:80px; height:80px; margin-bottom:15px;" viewBox="0 0 52 52">
        <circle class="checkmark-circle" cx="26" cy="26" r="23"/>
        <path class="checkmark-check" fill="none" d="M14.1 27.2l7.1 7.2 16.7-16.8"/>
      </svg>
      <h1 style="color:#fff; font-size:1.5rem; font-weight:800;">🎉 Congratulations!</h1>
      <p style="color:var(--gold); font-weight:700; font-size:0.9rem; margin-top:6px;">Loyalty Access Fashion থেকে পণ্য ক্রয়ের জন্য আপনাকে অসংখ্য ধন্যবাদ!</p>
      <div style="background:rgba(0,0,0,0.4); border:1px dashed var(--border); padding:12px; border-radius:10px; margin:20px 0; font-size:0.85rem;">
        <div>অর্ডার আইডি: <strong id="succOrderId" style="color:var(--gold);">LA-XXXXX</strong></div>
        <div>সর্বমোট বিল: <strong id="succTotal" style="color:#22c55e;">৳ 0</strong></div>
      </div>
      <div id="waBtnContainer" class="fade-in-btn">
        <a id="succWaBtn" href="#" target="_blank" class="btn btn-gold btn-block" style="background:#22c55e; color:#000; font-weight:800; border:none;">
          💬 WhatsApp-এ দ্রুত অর্ডার কনফার্ম করুন ➔
        </a>
      </div>
    </div>
  </section>
  <script src="products.js"></script>
  <script src="orders.js"></script>
  <script src="main.js"></script>
  <script>
    window.addEventListener('DOMContentLoaded', function() {
      const dataRaw = localStorage.getItem('last_completed_order');
      if (!dataRaw) { window.location.href = 'index.html'; return; }
      const data = JSON.parse(dataRaw);
      document.getElementById('succOrderId').textContent = data.orderId;
      document.getElementById('succTotal').textContent = '৳ ' + data.total;
      document.getElementById('succWaBtn').href = 'https://wa.me/' + WHATSAPP_NUMBER + '?text=' + encodeURIComponent(data.waMsg);
      if (typeof playCelebrationSound === 'function') playCelebrationSound();

      const speechText = "Congratulation, Loyalty Access Fashion থেকে পণ্য ক্রয়ের জন্য আপনাকে অসংখ্য ধন্যবাদ! অতি শীঘ্রই আমাদের একজন প্রতিনিধি আপনার সাথে যোগাযোগ করবে এছাড়া অর্ডারটি আরও দ্রুত কনফার্ম করতে নিচের বাটনটিতে ক্লিক করুন।";
      if ('speechSynthesis' in window) {
        const utterance = new SpeechSynthesisUtterance(speechText);
        utterance.lang = 'bn-BD'; utterance.rate = 0.95;
        utterance.onend = revealWhatsAppButton; utterance.onerror = revealWhatsAppButton;
        window.speechSynthesis.speak(utterance);
      }
      setTimeout(revealWhatsAppButton, 6000);
      function revealWhatsAppButton() {
        const container = document.getElementById('waBtnContainer');
        if (container) container.classList.add('show');
      }
    });
  </script>
</body>
</html>
